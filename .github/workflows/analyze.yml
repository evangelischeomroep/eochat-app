name: Flutter Analyze

# Catches Dart compile errors in minutes — before Xcode Cloud wastes 10+ minutes.
# Runs on every push to main and on every PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: dart analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: dart analyze
        run: flutter analyze --no-pub --fatal-infos
