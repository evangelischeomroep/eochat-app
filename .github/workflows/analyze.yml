name: Flutter Analyze

# Catches Dart compile errors in minutes — before Xcode Cloud wastes 10+ minutes.
# Runs on every push to main and on every PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: dart analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # pubspec.yaml has path dependencies (mermaid_core, mermaid_flutter)
          # inside third_party/mermaid, so pub get fails without submodules.
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Generate code
        # Pub workspace (v4.1.8+): run build_runner in every member that uses it.
        shell: bash
        run: |
          for dir in . packages/*; do
            if [ -f "$dir/pubspec.yaml" ] && grep -q '^  build_runner:' "$dir/pubspec.yaml"; then
              echo "::group::build_runner in $dir"
              (cd "$dir" && dart run build_runner build --delete-conflicting-outputs)
              echo "::endgroup::"
            fi
          done

      - name: dart analyze
        run: flutter analyze --no-pub --fatal-infos
