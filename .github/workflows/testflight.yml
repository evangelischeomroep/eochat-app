name: TestFlight

# Triggered on every push to main (each push also triggers Xcode Cloud).
# Waits for the Xcode Cloud build to succeed, then adds it to the AI-team
# TestFlight group — no laptop needed.
#
# One-time setup required:
#   Go to GitHub → Settings → Secrets and variables → Actions → New repository secret
#   Name: ASC_P8_KEY
#   Value: base64-encoded content of scripts/AuthKey_SNL4WUUBST.p8
#     macOS:  base64 -i scripts/AuthKey_SNL4WUUBST.p8 | pbcopy
#     Linux:  base64 -w0 scripts/AuthKey_SNL4WUUBST.p8

on:
  push:
    branches: [main]

jobs:
  testflight:
    name: Add to TestFlight (AI-team)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ASC key
        env:
          ASC_P8_KEY: ${{ secrets.ASC_P8_KEY }}
        run: |
          set -e
          echo "Secret length (chars): ${#ASC_P8_KEY}"
          if [ -z "$ASC_P8_KEY" ]; then
            echo "::error::ASC_P8_KEY secret is empty or not set"
            exit 1
          fi
          echo "$ASC_P8_KEY" | base64 -d > scripts/AuthKey_SNL4WUUBST.p8
          chmod 600 scripts/AuthKey_SNL4WUUBST.p8
          echo "Decoded key file size (bytes): $(wc -c < scripts/AuthKey_SNL4WUUBST.p8)"
          if ! grep -q "BEGIN PRIVATE KEY" scripts/AuthKey_SNL4WUUBST.p8; then
            echo "::error::Decoded file does not look like a PEM private key"
            exit 1
          fi
          echo "Key file looks valid."

      - name: Read app version
        id: ver
        run: |
          # Read from pubspec.yaml, which is the source of the build's
          # CFBundleShortVersionString and therefore the version the build
          # actually appears under in App Store Connect.
          #
          # This previously read .conduit-sync-version, which records which
          # upstream Conduit release the fork is synced to. Those two happened
          # to match, so a shipped-version bump that left the sync marker alone
          # would silently make this job poll for a version that never appears.
          VERSION=$(sed -n 's/^version:[[:space:]]*\([^+]*\)+.*/\1/p' pubspec.yaml)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not parse version from pubspec.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Targeting version $VERSION"

      - name: Wait for Xcode Cloud build and add to TestFlight
        run: python3 scripts/asc_testflight.py --version ${{ steps.ver.outputs.version }}
